name: Code Quality Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort mypy

      - name: Run Black (code formatter check)
        run: black --check app/lambdas/ --line-length 100
        continue-on-error: true

      - name: Run isort (import sorter check)
        run: isort --check-only app/lambdas/
        continue-on-error: true

      - name: Run Flake8 (style guide)
        run: flake8 app/lambdas/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

      - name: Run Pylint
        run: pylint app/lambdas/ --disable=C0111,C0103 --exit-zero
        continue-on-error: true

      - name: Run MyPy (type checking)
        run: mypy app/lambdas/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Check for known vulnerabilities
        run: |
          pip install -r infra/requirements.txt
          safety check --json
        continue-on-error: true

  code-coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          pip install pytest pytest-cov coverage

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ] && [ -f "tests/test_*.py" ]; then
            pytest tests/ -v --cov=app/lambdas --cov-report=xml --cov-report=html
          else
            echo "No tests found"
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
