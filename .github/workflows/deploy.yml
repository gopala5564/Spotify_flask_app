name: Deploy to AWS

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: '🎯 Choose environment to deploy'
        required: true 
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          pip install -r app/requirements.txt

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Verify CDK can synthesize
        run: |
          cd ${{ github.workspace }}
          cdk synth

      - name: Run tests (if available)
        run: |
          if [ -f "tests/requirements.txt" ]; then
            pip install -r tests/requirements.txt
            pytest tests/ -v --cov=app/lambdas --cov-report=xml
          else
            echo "No tests found, skipping test step"
          fi
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    name: Deploy to Dev
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    environment:
      name: development
      url: https://console.aws.amazon.com/cloudformation/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          pip install -r app/requirements.txt
          npm install -g aws-cdk

      - name: Deploy to Dev environment
        run: |
          cdk deploy SpotifyEtlStack \
            --parameters SpotifyClientId=${{ secrets.SPOTIFY_CLIENT_ID_DEV }} \
            --parameters SpotifyClientSecret=${{ secrets.SPOTIFY_CLIENT_SECRET_DEV }} \
            --require-approval never \
            --verbose
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Dev Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Dev Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Stack**: SpotifyEtlStack" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    name: Deploy to Production
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://console.aws.amazon.com/cloudformation/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          pip install -r app/requirements.txt
          npm install -g aws-cdk

      - name: Deploy to Production environment
        run: |
          cdk deploy SpotifyEtlStack \
            --parameters SpotifyClientId=${{ secrets.SPOTIFY_CLIENT_ID_PROD }} \
            --parameters SpotifyClientSecret=${{ secrets.SPOTIFY_CLIENT_SECRET_PROD }} \
            --require-approval never \
            --verbose
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack**: SpotifyEtlStack" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}: Spotify ETL Stack'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true

      - name: Notify mailbox
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Production Deployment ${{ job.status }} - Spotify ETL Stack"
          body: |
            Production deployment ${{ job.status }} for SpotifyEtlStack.
            Commit: ${{ github.sha }}
            Region: ${{ env.AWS_REGION }}
            Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
        continue-on-error: true

  manual-deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://console.aws.amazon.com/cloudformation/

    steps:
      - name: Guard - prod only from main
        if: github.event.inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "❌ Production deployments are only allowed from the main branch."
          echo "   Current branch: ${{ github.ref }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_TO_ASSUME_{0}', github.event.inputs.environment)] }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt
          pip install -r app/requirements.txt
          npm install -g aws-cdk

      - name: Deploy to ${{ github.event.inputs.environment }}
        run: |
          ENV=${{ github.event.inputs.environment }}
          ENV_UPPER=$(echo $ENV | tr '[:lower:]' '[:upper:]')
          
          cdk deploy SpotifyEtlStack \
            --parameters SpotifyClientId=${{ secrets[format('SPOTIFY_CLIENT_ID_{0}', env.ENV_UPPER)] }} \
            --parameters SpotifyClientSecret=${{ secrets[format('SPOTIFY_CLIENT_SECRET_{0}', env.ENV_UPPER)] }} \
            --require-approval never \
            --verbose
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Create deployment summary
        if: success()
        run: |
          echo "## 🚀 Manual Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack**: SpotifyEtlStack" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
